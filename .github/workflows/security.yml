name: security

# Scheduled + PR-triggered security audits. Blocking scans (gitleaks, pattern
# scan) also run per-push inside ci.yml; this workflow adds the dependency /
# vulnerability audit (govulncheck) on a weekly cadence and on PRs so findings
# surface before merge. Actions are pinned to commit SHAs; tool versions are
# pinned by version tag, resolved through the Go module proxy/checksum database.

on:
  pull_request:
  schedule:
    # Mondays 04:17 UTC (odd minute avoids top-of-hour scheduler load).
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go (version from go.mod, >= 1.26)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Run govulncheck (stdlib + module graph)
        run: |
          if [ -z "$(git ls-files '*.go')" ]; then
            echo "Module skeleton has no Go sources yet; nothing to audit."
            exit 0
          fi
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gitleaks:
    name: gitleaks (weekly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository (full history for --log-opts=--all)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go (used to run the pinned gitleaks binary)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gitleaks detect over full history
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect \
            --source . --log-opts="--all" --no-banner --redact
      - name: Category pattern scan (tracked files)
        # Same policy-21 / NFR-006 category scan as ci.yml (private IP
        # literals, home paths, personal emails). Kept structurally identical
        # to the ci.yml step so the two cannot drift apart.
        run: |
          set -euo pipefail
          # Private-use IP literals (10/8, 192.168/16, 172.16-31/12). The
          # (^|[^0-9]) guard prevents matches inside longer dotted-number
          # chains (e.g. "010.020.030.040").
          ip_pat='(^|[^0-9])((10([.]([0-9]{1,3})){3})|(192[.]168([.]([0-9]{1,3})){2})|(172[.](1[6-9]|2[0-9]|3[0-1])([.]([0-9]{1,3})){2}))'
          # POSIX home paths and Windows drive paths ([\\/] = one literal
          # backslash or forward slash in grep -E).
          home_pat='(/Users/[A-Za-z0-9._~-]+|/home/[A-Za-z0-9._~-]+|[Cc]:[\\/]Users)'
          email_pat='[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}'
          # git grep over tracked files avoids filename word-splitting. Exit
          # codes 0 (match) and 1 (no match) are both expected; >= 2 is a real
          # error (bad pattern, git failure) and must fail the step, not pass
          # silently. Each rc is captured on its own line before any filtering:
          # under pipefail, attaching a filter pipe to the capture would blur
          # "git grep errored" with "the filter dropped every line".
          #
          # Pass 1 — IPs and home paths, UNFILTERED. An allowlist filter here
          # drops whole lines, which could hide a private IP that shares a
          # line with an allowlisted email.
          rc=0
          hits_ip_home="$(git grep -En -e "$ip_pat" -e "$home_pat" -- .)" || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::git grep failed (rc=${rc})"
            exit 1
          fi
          # Pass 2 — emails. GitHub no-reply identities and @example
          # addresses are allowed, so ONLY this pass's output is filtered,
          # in a statement separate from the rc capture.
          rc=0
          raw_emails="$(git grep -En -e "$email_pat" -- .)" || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::git grep failed (rc=${rc})"
            exit 1
          fi
          hits_email=''
          if [ -n "$raw_emails" ]; then
            hits_email="$(printf '%s' "$raw_emails" | grep -Ev 'users[.]noreply[.]github[.]com|@example' || true)"
          fi
          hits="${hits_ip_home}${hits_email}"
          if [ -n "$hits" ]; then
            echo '::error::Pattern scan found possible private infrastructure details:'
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "Pattern scan clean (private IPs, home paths, personal emails)."
